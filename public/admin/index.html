<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="/favicon.png">
  <title>Painel Admin – Studio Alessandra</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --pink: #c84b70; --pink-light: #e07a95;
      --bg: #fbf0f3; --card: #ffffff;
      --border: #f4cbd6; --text: #333; --muted: #888;
      --font: 'DM Sans', sans-serif;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; }

    /* ── Topbar ── */
    .topbar {
      background: white; border-bottom: 1px solid var(--border);
      padding: 0 28px; height: 64px;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 100;
      box-shadow: 0 2px 12px rgba(200,75,112,0.08);
    }
    .topbar-left { display: flex; align-items: center; gap: 14px; }
    .topbar-left img { height: 40px; width: auto; }
    .topbar-left h1 { font-family: 'Playfair Display', serif; color: var(--pink); font-size: 1.3rem; }
    .topbar-right { display: flex; align-items: center; gap: 14px; }
    .btn-site { text-decoration: none; color: var(--muted); font-size: .9rem; }
    .btn-site:hover { color: var(--pink); }
    .btn-sair {
      background: none; border: 1.5px solid var(--border);
      color: var(--muted); padding: 7px 16px; border-radius: 20px;
      cursor: pointer; font-family: var(--font); font-size: .85rem; transition: .2s;
    }
    .btn-sair:hover { border-color: var(--pink); color: var(--pink); }

    /* ── Layout ── */
    .layout { display: flex; min-height: calc(100vh - 64px); }

    /* ── Sidebar ── */
    .sidebar {
      width: 220px; background: white;
      border-right: 1px solid var(--border);
      padding: 24px 12px; flex-shrink: 0;
    }
    .nav-item {
      display: flex; align-items: center; gap: 10px;
      padding: 11px 14px; border-radius: 10px;
      cursor: pointer; font-size: .92rem; color: var(--muted);
      margin-bottom: 4px; transition: .15s; border: none;
      background: none; width: 100%; text-align: left; font-family: var(--font);
    }
    .nav-item:hover { background: #fff0f7; color: var(--pink); }
    .nav-item.ativo { background: #fff0f7; color: var(--pink); font-weight: 600; }
    .nav-item .icon { font-size: 1.1rem; }

    /* ── Main ── */
    .main { flex: 1; min-width: 0; padding: 32px; overflow-y: auto; }

    /* ── Seções ── */
    .secao { display: none; }
    .secao.ativa { display: block; }
    .secao-titulo { font-family: 'Playfair Display', serif; color: var(--pink); font-size: 1.6rem; margin-bottom: 24px; }
    .secao-topo { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
    .servico-acoes { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .servico-acoes .status { font-size: .8rem; font-weight: 600; margin-left: auto; }
    .sem-foto { width: 100%; height: 160px; display: flex; align-items: center; justify-content: center; background: var(--bg); color: var(--muted); font-size: .85rem; }

    /* ── Cards ── */
    .card {
      background: var(--card); border-radius: 16px;
      border: 1px solid var(--border); padding: 24px;
      margin-bottom: 20px;
    }

    /* ── Serviços grid ── */
    .servicos-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 18px; }
    .servico-card {
      background: white; border: 1px solid var(--border);
      border-radius: 14px; overflow: hidden;
    }
    .servico-card img { width: 100%; height: 160px; object-fit: cover; display: block; }
    .servico-body { padding: 16px; }
    .servico-nome { font-weight: 600; font-size: 1rem; margin-bottom: 4px; }
    .servico-preco { color: var(--pink); font-weight: 600; font-size: .95rem; }
    .servico-desc { color: var(--muted); font-size: .88rem; margin: 6px 0 12px; line-height: 1.5; }

    /* ── Inputs ── */
    label { font-size: .83rem; font-weight: 500; color: #555; display: block; margin-bottom: 4px; }
    input[type=text], input[type=number], input[type=time], input[type=password],
    textarea, select {
      width: 100%; padding: 10px 12px;
      border: 1.5px solid var(--border); border-radius: 10px;
      font-size: .93rem; font-family: var(--font);
      margin-bottom: 12px; outline: none; transition: border .2s;
      background: white; color: var(--text);
    }
    input:focus, textarea:focus, select:focus { border-color: var(--pink); }
    textarea { resize: vertical; min-height: 80px; }

    /* ── Botões ── */
    .btn {
      padding: 10px 20px; border-radius: 30px; border: none;
      font-family: var(--font); font-size: .9rem; font-weight: 600;
      cursor: pointer; transition: .2s;
    }
    .btn-primary {
      background: linear-gradient(90deg, var(--pink), var(--pink-light));
      color: white; box-shadow: 0 4px 14px rgba(200,75,112,.25);
    }
    .btn-primary:hover { transform: scale(1.03); }
    .btn-ghost {
      background: none; border: 1.5px solid var(--border);
      color: var(--muted);
    }
    .btn-ghost:hover { border-color: var(--pink); color: var(--pink); }
    .btn-danger { background: #ffe8e8; color: #c62828; border: none; }
    .btn-danger:hover { background: #ffcccc; }
    .btn-sm { padding: 7px 14px; font-size: .82rem; }

    /* ── Toggle ── */
    .toggle-wrap { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .toggle {
      width: 44px; height: 24px; background: #ddd;
      border-radius: 12px; cursor: pointer; position: relative;
      transition: background .2s; border: none;
      flex-shrink: 0;
    }
    .toggle.on { background: var(--pink); }
    .toggle::after {
      content: ''; position: absolute; top: 3px; left: 3px;
      width: 18px; height: 18px; background: white;
      border-radius: 50%; transition: left .2s;
    }
    .toggle.on::after { left: 23px; }

    /* ── Horários ── */
    .dia-row {
      display: grid; grid-template-columns: 120px 44px 1fr 1fr;
      align-items: center; gap: 14px;
      padding: 10px 0; border-bottom: 1px solid var(--border);
    }
    .dia-row:last-child { border-bottom: none; }
    .dia-nome { font-weight: 500; font-size: .95rem; }
    .dia-row input[type=time] { margin-bottom: 0; }

    /* ── Promoções ── */
    .promo-card {
      display: flex; justify-content: space-between; align-items: flex-start;
      background: white; border: 1px solid var(--border);
      border-radius: 12px; padding: 16px; margin-bottom: 12px;
    }
    .promo-info h3 { font-size: 1rem; color: var(--pink); margin-bottom: 4px; }
    .promo-info p { font-size: .88rem; color: var(--muted); }
    .promo-acoes { display: flex; gap: 8px; flex-shrink: 0; }

    /* ── Upload foto ── */
    .foto-upload {
      border: 2px dashed var(--border); border-radius: 10px;
      padding: 16px; text-align: center; cursor: pointer;
      transition: border .2s; margin-bottom: 12px;
    }
    .foto-upload:hover { border-color: var(--pink); }
    .foto-upload input { display: none; }
    .foto-preview { width: 100%; height: 120px; object-fit: cover; border-radius: 8px; margin-bottom: 8px; }

    /* ── Toast ── */
    .toast {
      position: fixed; bottom: 28px; right: 28px;
      background: #222; color: white; padding: 14px 22px;
      border-radius: 12px; font-size: .9rem; z-index: 9999;
      transform: translateY(80px); opacity: 0;
      transition: .3s; pointer-events: none;
    }
    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.success { background: #1b5e20; }
    .toast.error { background: #b71c1c; }

    /* ── Contato form ── */
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 600px) { .form-row { grid-template-columns: 1fr; } }

    /* ── Celular ───────────────────────────────────────── */
    @media (max-width: 760px) {
      /* Topo compacto */
      .topbar { padding: 0 14px; height: 60px; }
      .topbar-left { gap: 8px; min-width: 0; }
      .topbar-left img { height: 34px; }
      .topbar-left h1 { display: none; }
      .topbar-right { gap: 8px; }
      .btn-site { font-size: .85rem; white-space: nowrap; padding: 8px 4px; }
      .btn-sair { padding: 8px 14px; }

      /* Menu lateral vira barra de abas que rola de lado */
      .layout { flex-direction: column; min-height: calc(100vh - 60px); }
      .sidebar {
        width: 100%; display: flex; gap: 6px;
        padding: 10px 12px; overflow-x: auto;
        border-right: none; border-bottom: 1px solid var(--border);
        position: sticky; top: 60px; z-index: 90;
        scrollbar-width: none;
      }
      .sidebar::-webkit-scrollbar { display: none; }
      .nav-item {
        width: auto; flex-shrink: 0; margin-bottom: 0;
        padding: 10px 14px; border-radius: 999px; white-space: nowrap;
        border: 1.5px solid var(--border);
      }
      .nav-item.ativo { border-color: var(--pink); }

      /* Conteúdo em largura total */
      .main { padding: 20px 14px 40px; }
      .secao-titulo { font-size: 1.35rem; margin-bottom: 16px; }
      .card { padding: 18px 16px; border-radius: 14px; }
      .servicos-grid { grid-template-columns: 1fr; gap: 14px; }
      .servico-card img { height: 190px; }

      /* Campos com fonte 16px: evita o zoom automático do iPhone */
      input[type=text], input[type=number], input[type=time], input[type=password], textarea, select {
        font-size: 16px; padding: 12px;
      }
      .btn { padding: 12px 20px; }

      /* Horários: nome do dia + botão em cima, horários embaixo */
      .dia-row {
        grid-template-columns: 1fr 1fr;
        grid-template-areas: "nome toggle" "abre fecha";
        gap: 8px 12px; padding: 14px 0;
      }
      .dia-row > .dia-nome { grid-area: nome; align-self: center; }
      .dia-row > .toggle { grid-area: toggle; justify-self: end; }
      .dia-row > div:nth-of-type(1) { grid-area: abre; }
      .dia-row > div:nth-of-type(2) { grid-area: fecha; }

      /* Promoções: botões embaixo do texto */
      .promo-card { flex-direction: column; gap: 12px; }
      .promo-acoes { width: 100%; flex-wrap: wrap; }
      .promo-acoes .btn { flex: 1; }

      /* Janela de edição ocupa a tela, com botões fáceis de tocar */
      #modal-servico { align-items: flex-end !important; }
      .modal-box {
        width: 100% !important; max-height: 92vh !important;
        border-radius: 20px 20px 0 0 !important; padding: 22px 16px 28px !important;
      }
      .modal-acoes { flex-direction: column-reverse; }
      .modal-acoes .btn { width: 100%; }

      /* Aviso centralizado na parte de baixo */
      .toast { left: 14px; right: 14px; bottom: 18px; text-align: center; }
    }

    @media (max-width: 380px) {
      .btn-site .txt { display: none; }
    }
  </style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <img src="/imagens/logo.png" alt="Studio Alessandra">
    <h1>Painel Administrativo</h1>
  </div>
  <div class="topbar-right">
    <a href="/" target="_blank" rel="noopener" class="btn-site" id="link-site">↗ <span class="txt">Ver site</span></a>
    <button class="btn-sair" onclick="sair()">Sair</button>
  </div>
</div>

<div class="layout">
  <nav class="sidebar">
    <button class="nav-item ativo" onclick="irPara('servicos', this)">
      <span class="icon">💅</span> Serviços
    </button>
    <button class="nav-item" onclick="irPara('horarios', this)">
      <span class="icon">⏰</span> Horários
    </button>
    <button class="nav-item" onclick="irPara('promocoes', this)">
      <span class="icon">🌸</span> Promoções
    </button>
    <button class="nav-item" onclick="irPara('contato', this)">
      <span class="icon">📱</span> Contato
    </button>
    <button class="nav-item" onclick="irPara('senha', this)">
      <span class="icon">🔒</span> Senha
    </button>
  </nav>

  <main class="main">

    <!-- ── SERVIÇOS ── -->
    <section class="secao ativa" id="sec-servicos">
      <div class="secao-topo">
        <div class="secao-titulo">Gerenciar Serviços</div>
        <button class="btn btn-primary" onclick="novoServico()">+ Novo serviço</button>
      </div>
      <div class="servicos-grid" id="lista-servicos">
        <p style="color:#aaa">Carregando...</p>
      </div>
    </section>

    <!-- ── Modal Editar Serviço ── -->
    <div id="modal-servico" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;display:none;align-items:center;justify-content:center">
      <div class="modal-box" style="background:white;border-radius:20px;padding:32px;width:min(94%,520px);max-height:90vh;overflow-y:auto">
        <h2 id="modal-titulo" style="font-family:'Playfair Display',serif;color:var(--pink);margin-bottom:20px">Editar Serviço</h2>
        <input type="hidden" id="edit-id">

        <label>Nome do serviço</label>
        <input type="text" id="edit-nome">

        <label>Preço (ex: 180,00)</label>
        <input type="text" id="edit-preco">

        <label>Descrição</label>
        <textarea id="edit-desc" rows="4"></textarea>

        <label id="label-foto">Foto atual</label>
        <div class="foto-upload" onclick="document.getElementById('edit-foto-input').click()">
          <img id="edit-foto-preview" class="foto-preview" src="" alt="">
          <div style="font-size:.85rem;color:var(--muted)">Clique para trocar a foto</div>
          <input type="file" id="edit-foto-input" accept="image/*" onchange="previewFoto(this)">
        </div>

        <div style="display:flex;gap:10px;margin-top:8px">
          <label style="display:flex;align-items:center;gap:8px;margin:0">
            <input type="checkbox" id="edit-ativo" style="width:auto;margin:0">
            Serviço ativo (visível no site)
          </label>
        </div>

        <div class="modal-acoes" style="display:flex;gap:10px;margin-top:20px;justify-content:flex-end">
          <button class="btn btn-ghost" onclick="fecharModal()">Cancelar</button>
          <button class="btn btn-primary" onclick="salvarServico()">Salvar alterações</button>
        </div>
      </div>
    </div>

    <!-- ── HORÁRIOS ── -->
    <section class="secao" id="sec-horarios">
      <div class="secao-titulo">Horários de Atendimento</div>
      <div class="card">
        <div id="horarios-form"></div>
        <button class="btn btn-primary" style="margin-top:16px" onclick="salvarHorarios()">Salvar horários</button>
      </div>
    </section>

    <!-- ── PROMOÇÕES ── -->
    <section class="secao" id="sec-promocoes">
      <div class="secao-titulo">Promoções</div>

      <div class="card">
        <p style="font-weight:600;margin-bottom:14px">Nova promoção</p>
        <div class="form-row">
          <div>
            <label>Título</label>
            <input type="text" id="promo-titulo" placeholder="Ex: Semana do Gel">
          </div>
          <div>
            <label>Descrição curta</label>
            <input type="text" id="promo-desc" placeholder="Ex: 20% de desconto no banho em gel">
          </div>
        </div>
        <button class="btn btn-primary" onclick="adicionarPromo()">Adicionar promoção</button>
      </div>

      <div id="lista-promocoes"></div>
    </section>

    <!-- ── CONTATO ── -->
    <section class="secao" id="sec-contato">
      <div class="secao-titulo">Informações de Contato</div>
      <div class="card">
        <label>Instagram (URL completa)</label>
        <input type="text" id="c-instagram" placeholder="https://www.instagram.com/seu_perfil">

        <label>WhatsApp (só números, com DDI: 5554999999999)</label>
        <input type="text" id="c-whatsapp" placeholder="5554999999999">

        <label>Link de agendamento</label>
        <input type="text" id="c-agendamento" placeholder="https://link-do-agendamento.com">

        <button class="btn btn-primary" onclick="salvarContato()">Salvar contato</button>
      </div>
    </section>

    <!-- ── SENHA ── -->
    <section class="secao" id="sec-senha">
      <div class="secao-titulo">Alterar Senha</div>
      <div class="card" style="max-width:400px">
        <label>Senha atual</label>
        <input type="password" id="senha-atual">
        <label>Nova senha</label>
        <input type="password" id="senha-nova">
        <label>Confirmar nova senha</label>
        <input type="password" id="senha-conf">
        <button class="btn btn-primary" onclick="alterarSenha()">Alterar senha</button>
      </div>
    </section>

  </main>
</div>

<div class="toast" id="toast"></div>

<script>
// ── Endereços: no subdomínio admin.studioalenails.com.br usa /painel e /login ──
const NO_SUBDOMINIO = location.hostname.startsWith('admin.');
const LOGIN = NO_SUBDOMINIO ? '/login' : '/admin/login';
if (NO_SUBDOMINIO) document.getElementById('link-site').href = 'https://www.' + location.hostname.replace(/^admin\./, '');

// Chamada à API: se der erro, mostra a mensagem e interrompe a ação
async function api(url, opcoes) {
  let res;
  try {
    res = await fetch(url, opcoes);
  } catch {
    toast('Sem conexão. Verifique a internet e tente de novo.', 'error');
    throw new Error('rede');
  }
  if (res.status === 401) { location.href = LOGIN; throw new Error('401'); }
  if (!res.ok) {
    let msg = 'Não foi possível salvar. Tente de novo.';
    try { msg = (await res.json()).erro || msg; } catch {}
    toast(msg, 'error');
    throw new Error(msg);
  }
  return res;
}

// Reduz a foto no navegador antes de enviar (mais rápido e dentro do limite da Vercel)
function comprimirImagem(arquivo, max = 1600, qualidade = 0.85) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      const escala = Math.min(1, max / Math.max(img.width, img.height));
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(img.width * escala);
      canvas.height = Math.round(img.height * escala);
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      canvas.toBlob((blob) => resolve(blob || arquivo), 'image/jpeg', qualidade);
      URL.revokeObjectURL(img.src);
    };
    img.onerror = () => resolve(arquivo);
    img.src = URL.createObjectURL(arquivo);
  });
}
// ── Auth check ────────────────────────────────────────────
fetch('/api/sessao').then(r => r.json()).then(d => {
  if (!d.logado) location.href = LOGIN;
  else carregarTudo();
});

function sair() {
  fetch('/api/logout', { method: 'POST' }).then(() => location.href = LOGIN);
}

// ── Navegação ─────────────────────────────────────────────
function irPara(secao, btn) {
  document.querySelectorAll('.secao').forEach(s => s.classList.remove('ativa'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('ativo'));
  document.getElementById('sec-' + secao).classList.add('ativa');
  btn.classList.add('ativo');
}

// ── Toast ─────────────────────────────────────────────────
function toast(msg, tipo = 'success') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + tipo;
  setTimeout(() => t.className = 'toast', 3000);
}

// ── Carregar tudo ─────────────────────────────────────────
function carregarTudo() {
  carregarServicos();
  carregarHorarios();
  carregarPromocoes();
  carregarContato();
}

// ── SERVIÇOS ──────────────────────────────────────────────
let servicosData = [];

async function carregarServicos() {
  const res = await api('/api/admin/servicos');
  servicosData = await res.json();
  renderServicos();
}

// Evita que um texto digitado vire código na página
function esc(v) {
  return String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function renderServicos() {
  const container = document.getElementById('lista-servicos');
  if (!servicosData.length) {
    container.innerHTML = '<p style="color:#aaa">Nenhum serviço cadastrado. Clique em "+ Novo serviço".</p>';
    return;
  }
  container.innerHTML = servicosData.map(s => `
    <div class="servico-card">
      ${s.foto
        ? `<img src="${esc(s.foto)}" alt="${esc(s.nome)}" onerror="this.src='/imagens/logo.png'">`
        : '<div class="sem-foto">Sem foto</div>'}
      <div class="servico-body">
        <div class="servico-nome">${esc(s.nome)}</div>
        <div class="servico-preco">${s.preco ? 'R$ ' + esc(s.preco) : 'Sem preço'}</div>
        <div class="servico-desc">${esc((s.descricao || '').substring(0, 90))}${(s.descricao || '').length > 90 ? '...' : ''}</div>
        <div class="servico-acoes">
          <button class="btn btn-primary btn-sm" onclick="abrirModal(${s.id})">✏️ Editar</button>
          <button class="btn btn-danger btn-sm" onclick="excluirServico(${s.id})">Excluir</button>
          <span class="status" style="color:${s.ativo ? '#2e7d32' : '#c62828'}">${s.ativo ? '● Ativo' : '○ Oculto'}</span>
        </div>
      </div>
    </div>
  `).join('');
}

function novoServico() {
  document.getElementById('modal-titulo').textContent = 'Novo serviço';
  document.getElementById('label-foto').textContent = 'Foto do serviço';
  document.getElementById('edit-id').value = '';
  document.getElementById('edit-nome').value = '';
  document.getElementById('edit-preco').value = '';
  document.getElementById('edit-desc').value = '';
  document.getElementById('edit-ativo').checked = true;
  const preview = document.getElementById('edit-foto-preview');
  preview.removeAttribute('src');
  preview.style.display = 'none';
  document.getElementById('edit-foto-input').value = '';
  document.getElementById('modal-servico').style.display = 'flex';
  document.getElementById('edit-nome').focus();
}

async function excluirServico(id) {
  const s = servicosData.find(x => x.id === id);
  if (!s) return;
  if (!confirm(`Excluir o serviço "${s.nome}"? Ele some do site e não dá para desfazer.`)) return;
  await api('/api/admin/servicos/' + id, { method: 'DELETE' });
  await carregarServicos();
  toast('Serviço excluído');
}

function abrirModal(id) {
  const s = servicosData.find(x => x.id === id);
  document.getElementById('modal-titulo').textContent = 'Editar Serviço';
  document.getElementById('label-foto').textContent = 'Foto atual';
  document.getElementById('edit-foto-preview').style.display = s.foto ? 'block' : 'none';
  document.getElementById('edit-id').value = id;
  document.getElementById('edit-nome').value = s.nome;
  document.getElementById('edit-preco').value = s.preco;
  document.getElementById('edit-desc').value = s.descricao;
  document.getElementById('edit-ativo').checked = s.ativo;
  document.getElementById('edit-foto-preview').src = s.foto;
  document.getElementById('edit-foto-input').value = '';
  document.getElementById('modal-servico').style.display = 'flex';
}

function fecharModal() {
  document.getElementById('modal-servico').style.display = 'none';
}

function previewFoto(input) {
  if (input.files && input.files[0]) {
    const preview = document.getElementById('edit-foto-preview');
    preview.src = URL.createObjectURL(input.files[0]);
    preview.style.display = 'block';
  }
}

async function salvarServico() {
  let id = parseInt(document.getElementById('edit-id').value);
  const novo = !id;
  const dados = {
    nome: document.getElementById('edit-nome').value.trim(),
    preco: document.getElementById('edit-preco').value.trim(),
    descricao: document.getElementById('edit-desc').value.trim(),
    ativo: document.getElementById('edit-ativo').checked
  };

  if (!dados.nome) { toast('Informe o nome do serviço', 'error'); return; }

  // Salvar dados de texto (cria o serviço se for novo)
  if (novo) {
    const res = await api('/api/admin/servicos', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(dados)
    });
    id = (await res.json()).servico.id;
  } else {
    await api('/api/admin/servicos/' + id, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(dados)
    });
  }

  // Upload de foto se selecionada
  const fotoInput = document.getElementById('edit-foto-input');
  if (fotoInput.files && fotoInput.files[0]) {
    const form = new FormData();
    const foto = await comprimirImagem(fotoInput.files[0]);
    form.append('foto', foto, 'foto.jpg');
    await api('/api/admin/servicos/' + id + '/foto', { method: 'POST', body: form });
  }

  fecharModal();
  await carregarServicos();
  toast(novo ? 'Serviço criado! 💅' : 'Serviço atualizado com sucesso! 💅');
}

// ── HORÁRIOS ──────────────────────────────────────────────
const DIAS_LABEL = {
  segunda:'Segunda-feira', terca:'Terça-feira', quarta:'Quarta-feira',
  quinta:'Quinta-feira', sexta:'Sexta-feira', sabado:'Sábado', domingo:'Domingo'
};

async function carregarHorarios() {
  const res = await api('/api/admin/horarios');
  const h = await res.json();
  const form = document.getElementById('horarios-form');
  form.innerHTML = Object.entries(h).map(([dia, v]) => `
    <div class="dia-row">
      <span class="dia-nome">${DIAS_LABEL[dia]}</span>
      <button type="button" class="toggle ${v.ativo ? 'on' : ''}" id="tog-${dia}"
        onclick="toggleDia('${dia}')"></button>
      <div>
        <label style="font-size:.78rem">Abertura</label>
        <input type="time" id="ab-${dia}" value="${v.abertura}" ${!v.ativo ? 'disabled' : ''}>
      </div>
      <div>
        <label style="font-size:.78rem">Fechamento</label>
        <input type="time" id="fe-${dia}" value="${v.fechamento}" ${!v.ativo ? 'disabled' : ''}>
      </div>
    </div>
  `).join('');
}

function toggleDia(dia) {
  const tog = document.getElementById('tog-' + dia);
  const on = tog.classList.toggle('on');
  document.getElementById('ab-' + dia).disabled = !on;
  document.getElementById('fe-' + dia).disabled = !on;
}

async function salvarHorarios() {
  const dias = ['segunda','terca','quarta','quinta','sexta','sabado','domingo'];
  const horarios = {};
  dias.forEach(d => {
    horarios[d] = {
      ativo: document.getElementById('tog-' + d).classList.contains('on'),
      abertura: document.getElementById('ab-' + d).value,
      fechamento: document.getElementById('fe-' + d).value
    };
  });
  await api('/api/admin/horarios', {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(horarios)
  });
  toast('Horários salvos! ⏰');
}

// ── PROMOÇÕES ─────────────────────────────────────────────
async function carregarPromocoes() {
  const res = await api('/api/admin/promocoes');
  const promos = await res.json();
  renderPromocoes(promos);
}

function renderPromocoes(promos) {
  const lista = document.getElementById('lista-promocoes');
  if (!promos.length) {
    lista.innerHTML = '<p style="color:#aaa;text-align:center;padding:20px">Nenhuma promoção cadastrada.</p>';
    return;
  }
  lista.innerHTML = promos.map(p => `
    <div class="promo-card">
      <div class="promo-info">
        <h3>${p.titulo}</h3>
        <p>${p.descricao}</p>
      </div>
      <div class="promo-acoes">
        <button class="btn btn-sm ${p.ativo ? 'btn-ghost' : 'btn-primary'}"
          onclick="togglePromo(${p.id}, ${!p.ativo})">
          ${p.ativo ? 'Pausar' : 'Ativar'}
        </button>
        <button class="btn btn-danger btn-sm" onclick="excluirPromo(${p.id})">Excluir</button>
      </div>
    </div>
  `).join('');
}

async function adicionarPromo() {
  const titulo = document.getElementById('promo-titulo').value.trim();
  const descricao = document.getElementById('promo-desc').value.trim();
  if (!titulo || !descricao) { toast('Preencha título e descrição', 'error'); return; }

  const res = await api('/api/admin/promocoes', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ titulo, descricao })
  });
  document.getElementById('promo-titulo').value = '';
  document.getElementById('promo-desc').value = '';
  await carregarPromocoes();
  toast('Promoção adicionada! 🌸');
}

async function togglePromo(id, ativo) {
  await api('/api/admin/promocoes/' + id, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ ativo })
  });
  await carregarPromocoes();
  toast(ativo ? 'Promoção ativada! 🌸' : 'Promoção pausada');
}

async function excluirPromo(id) {
  if (!confirm('Excluir esta promoção?')) return;
  await api('/api/admin/promocoes/' + id, { method: 'DELETE' });
  await carregarPromocoes();
  toast('Promoção excluída');
}

// ── CONTATO ───────────────────────────────────────────────
async function carregarContato() {
  const res = await api('/api/admin/contato');
  const c = await res.json();
  document.getElementById('c-instagram').value = c.instagram || '';
  document.getElementById('c-whatsapp').value = c.whatsapp || '';
  document.getElementById('c-agendamento').value = c.agendamento || '';
}

async function salvarContato() {
  const contato = {
    instagram: document.getElementById('c-instagram').value.trim(),
    whatsapp: document.getElementById('c-whatsapp').value.trim(),
    agendamento: document.getElementById('c-agendamento').value.trim()
  };
  await api('/api/admin/contato', {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(contato)
  });
  toast('Contato salvo! 📱');
}

// ── SENHA ─────────────────────────────────────────────────
async function alterarSenha() {
  const senhaAtual = document.getElementById('senha-atual').value;
  const novaSenha = document.getElementById('senha-nova').value;
  const senhaConf = document.getElementById('senha-conf').value;

  if (!senhaAtual || !novaSenha) { toast('Preencha todos os campos', 'error'); return; }
  if (novaSenha !== senhaConf) { toast('As senhas não coincidem', 'error'); return; }
  if (novaSenha.length < 6) { toast('A nova senha precisa ter no mínimo 6 caracteres', 'error'); return; }

  const res = await fetch('/api/admin/senha', {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ senhaAtual, novaSenha })
  });

  if (res.ok) {
    toast('Senha alterada com sucesso! 🔒');
    document.getElementById('senha-atual').value = '';
    document.getElementById('senha-nova').value = '';
    document.getElementById('senha-conf').value = '';
  } else {
    let msg = 'Senha atual incorreta';
    try { msg = (await res.json()).erro || msg; } catch {}
    toast(msg, 'error');
  }
}

// ── Fechar modal clicando fora ────────────────────────────
document.getElementById('modal-servico').addEventListener('click', function(e) {
  if (e.target === this) fecharModal();
});
</script>
