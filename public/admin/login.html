<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="/favicon.png">
  <title>Admin – Studio Alessandra</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: radial-gradient(circle at 20% 10%, #f9e1e8 0%, #fbf0f3 45%, #f4cbd6 100%);
    }
    .card {
      background: white;
      border-radius: 24px;
      padding: 50px 44px;
      width: min(90%, 420px);
      box-shadow: 0 30px 70px -30px rgba(142,47,77,0.45);
      text-align: center;
    }
    .logo { width: 220px; height: auto; margin: 0 auto 22px; display: block; }
    h1 {
      font-family: 'Playfair Display', serif;
      color: #8e2f4d; font-size: 1.6rem; margin-bottom: 6px;
    }
    p { color: #888; font-size: .95rem; margin-bottom: 28px; }
    label { display: block; text-align: left; font-size: .85rem; font-weight: 500; color: #555; margin-bottom: 6px; }
    input[type=text], input[type=password] {
      width: 100%; padding: 14px 16px;
      border: 1.5px solid #f4cbd6; border-radius: 12px;
      font-size: 1rem; font-family: inherit;
      margin-bottom: 18px; outline: none;
      transition: border .2s;
    }
    input:focus { border-color: #c84b70; box-shadow: 0 0 0 4px rgba(200,75,112,.15); }
    button {
      width: 100%; padding: 15px;
      background: #c84b70;
      color: white; border: none; border-radius: 40px;
      font-size: 1rem; font-weight: 600; font-family: inherit;
      cursor: pointer; transition: transform .2s, box-shadow .2s;
      box-shadow: 0 10px 24px -10px rgba(200,75,112,0.7);
    }
    button:hover { background: #b13d61; }
    button:disabled { opacity: .7; cursor: wait; }
    .erro { color: #e53935; font-size: .9rem; margin-top: 12px; min-height: 20px; }
    .volta { margin-top: 20px; display: block; color: #aaa; font-size: .85rem; text-decoration: none; }
    .volta:hover { color: #c84b70; }
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="/imagens/logo.png" alt="Studio Alessandra">
    <h1>Painel Admin</h1>
    <p>Studio Alessandra</p>

    <form id="form-login" novalidate>
      <label for="usuario">Usuário</label>
      <input type="text" id="usuario" placeholder="seu usuário" autocomplete="username" autocapitalize="none">
      <label for="senha">Senha</label>
      <input type="password" id="senha" placeholder="••••••••" autocomplete="current-password">
      <button type="submit" id="btn-entrar">Entrar</button>
      <div class="erro" id="erro" role="alert"></div>
    </form>

    <a class="volta" id="link-site" href="/">Voltar ao site</a>
  </div>

  <script>
    const NO_SUBDOMINIO = location.hostname.startsWith('admin.');
    const PAINEL = NO_SUBDOMINIO ? '/painel' : '/admin';
    if (NO_SUBDOMINIO) document.getElementById('link-site').href = 'https://' + location.hostname.replace(/^admin\./, '');

    // Se já logado, redireciona
    fetch('/api/sessao').then(r => r.json()).then(d => {
      if (d.logado) location.href = PAINEL;
    }).catch(() => {});

    document.getElementById('form-login').addEventListener('submit', (e) => { e.preventDefault(); entrar(); });

    async function entrar() {
      const usuario = document.getElementById('usuario').value.trim();
      const senha = document.getElementById('senha').value;
      const erroEl = document.getElementById('erro');
      erroEl.textContent = '';

      if (!usuario || !senha) { erroEl.textContent = 'Preencha todos os campos'; return; }

      const botao = document.getElementById('btn-entrar');
      botao.disabled = true;
      botao.textContent = 'Entrando...';
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ usuario, senha })
        });
        if (res.ok) { location.href = PAINEL; return; }
        let msg = 'Usuário ou senha incorretos';
        try { msg = (await res.json()).erro || msg; } catch {}
        erroEl.textContent = msg;
        document.getElementById('senha').value = '';
      } catch {
        erroEl.textContent = 'Sem conexão. Verifique a internet e tente de novo.';
      }
      botao.disabled = false;
      botao.textContent = 'Entrar';
    }
  </script>
</body>
</html>
