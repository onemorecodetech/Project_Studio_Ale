<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Serviços – Studio Alessandra</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <div class="menu">
      <div class="logo"><a href="/"><img src="/imagens/Estilo_logo.png" alt="Studio Alessandra"></a></div>
      <div class="menu-toggle" onclick="toggleMenu()">☰</div>
      <ul class="menu-links" id="menuLinks">
        <li><a href="/">Início</a></li>
        <li><a href="/servicos.html">Serviços</a></li>
        <li><a href="/agendamento.html">Agendamento</a></li>
        <li><a href="/sobre.html">Sobre</a></li>
      </ul>
    </div>
  </header>

  <div id="banner-promo" style="display:none"></div>

  <div id="servicos-container" class="servicos-container">
    <p style="text-align:center;color:#888;padding:40px">Carregando serviços...</p>
  </div>

  <footer class="footer">
    <p>Siga o Studio Alessandra</p>
    <div class="redes-sociais" id="redes-sociais"></div>
    <p class="copy">© 2026 Studio Alessandra</p>
  </footer>

  <script>
    function toggleMenu() {
      document.getElementById('menuLinks').classList.toggle('active');
    }

    fetch('/api/dados').then(r => r.json()).then(data => {
      // Redes sociais
      document.getElementById('redes-sociais').innerHTML = `
        <a href="${data.contato.instagram}" target="_blank">Instagram</a>
        <a href="https://wa.me/${data.contato.whatsapp}" target="_blank">WhatsApp</a>
        <a href="${data.contato.agendamento}" target="_blank">Agendamento</a>
      `;

      // Promoções
      const promos = data.promocoes.filter(p => p.ativo);
      if (promos.length) {
        const banner = document.getElementById('banner-promo');
        banner.style.display = 'block';
        banner.innerHTML = promos.map(p =>
          `<div class="promo-item">🌸 <strong>${p.titulo}</strong> — ${p.descricao}</div>`
        ).join('');
      }

      // Serviços
      const container = document.getElementById('servicos-container');
      if (!data.servicos.length) {
        container.innerHTML = '<p style="text-align:center;padding:40px">Nenhum serviço disponível no momento.</p>';
        return;
      }
      container.innerHTML = data.servicos.map(s => `
        <div class="card-servico" onclick="this.classList.toggle('ativo')">
          <h1>${s.nome}</h1>
          <div class="foto-servico">
            <img src="${s.foto}" alt="${s.nome}" onerror="this.src='/imagens/Estilo_logo.png'">
          </div>
          <h2>R$ ${s.preco}</h2>
          <div class="descricao"><p>${s.descricao}</p></div>
        </div>
      `).join('');
    });
  </script>
</body>
</html>
